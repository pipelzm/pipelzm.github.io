<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Contacto · Felipe Lizama-Mora" />
  <title>Contact · Felipe Lizama-Mora</title>
  <style>
    :root {
      color-scheme: light dark;
      --text: #111;
      --muted: rgba(17, 17, 17, 0.72);
      --line: rgba(17, 17, 17, 0.22);
      --card: rgba(17, 17, 17, 0.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f2f2f2;
        --muted: rgba(242, 242, 242, 0.72);
        --line: rgba(242, 242, 242, 0.28);
        --card: rgba(242, 242, 242, 0.06);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: Canvas;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: clamp(48px, 8vw, 96px) 24px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 2.75rem);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .back {
      font-size: 0.95rem;
      color: var(--muted);
      text-decoration: none;
    }
    .back:hover { text-decoration: underline; text-underline-offset: 4px; }
    .divider {
      margin: 18px 0 30px;
      border: none;
      border-top: 1px solid var(--line);
    }
    .card {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 14px;
      padding: 18px 18px;
    }
    p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }
    .links {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    @media (min-width: 700px) {
      .links { grid-template-columns: 1fr 1fr; }
    }
    .link {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 14px;
      text-decoration: none;
      color: inherit;
      display: block;
      background: transparent;
      transition: transform 0.12s ease, background 0.12s ease;
    }
    .link:hover {
      transform: translateY(-1px);
      background: var(--card);
    }
    .link .k { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    .link .v { display: block; font-size: 1rem; }
    footer {
      margin-top: 44px;
      font-size: 0.875rem;
      color: var(--muted);
    }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Contact</h1>
      <a class="back" href="index.html">← inicio</a>
    </header>
    <hr class="divider" />

    <section class="card">
      <p>Si quieres colaborar, preguntar algo o proponer una idea, aquí están los canales más directos.</p>

      <div class="links" aria-label="Enlaces de contacto">
        <a class="link" href="https://github.com/pipelzm" rel="noopener noreferrer">
          <span class="k">GitHub</span>
          <span class="v">@pipelzm</span>
        </a>
        <a class="link" href="https://mlkfeed.framer.website" rel="noopener noreferrer">
          <span class="k">Feedback</span>
          <span class="v">Deja un mensaje</span>
        </a>
        <a class="link" href="https://github.com/pipelzm/Moleku/issues" rel="noopener noreferrer">
          <span class="k">Moleku</span>
          <span class="v">Issues / soporte</span>
        </a>
        <a class="link" href="about.html">
          <span class="k">About</span>
          <span class="v">Más sobre mí</span>
        </a>
      </div>
    </section>

    <footer>
      <span id="year"></span> · Felipe Lizama-Mora
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = String(new Date().getFullYear());
  </script>
</body>
</html>
