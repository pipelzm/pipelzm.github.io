<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Felipe Lizama-Mora — Biotecnología" />
  <title>Felipe Lizama-Mora</title>
  <style>
    :root {
      color-scheme: light dark;
      --text: #111;
      --muted: rgba(17, 17, 17, 0.72);
      --line: rgba(17, 17, 17, 0.22);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f2f2f2;
        --muted: rgba(242, 242, 242, 0.72);
        --line: rgba(242, 242, 242, 0.28);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: Canvas;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: clamp(48px, 8vw, 96px) 24px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.75rem, 7vw, 4.25rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .subtitle {
      margin: 0 0 22px;
      font-size: clamp(1rem, 2.2vw, 1.125rem);
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .clock {
      margin: 0 0 28px;
      font-size: 0.95rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .divider {
      margin: 0 0 32px;
      border: none;
      border-top: 1px solid var(--line);
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.25rem;
      font-size: 1rem;
    }
    nav a {
      color: inherit;
      text-decoration: none;
      opacity: 0.82;
      transition: opacity 0.15s ease;
    }
    nav a:hover {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    footer {
      margin-top: 48px;
      font-size: 0.875rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Felipe Lizama-Mora</h1>
    <p class="subtitle">Biotechnology</p>
    <p class="clock">Temuco, CL — <span id="time" aria-live="polite">Cargando hora...</span></p>
    <hr class="divider" />
    <nav aria-label="Navegación principal">
      <a href="#about">about</a>
      <a href="#projects">projects</a>
      <a href="#contact">contact</a>
      <a href="https://github.com/pipelzm" rel="noopener noreferrer">github</a>
      <a href="https://mlkfeed.framer.website" rel="noopener noreferrer">feedback</a>
    </nav>
    <footer>
      <span id="year"></span> · powered by RAVEN | プログラム
    </footer>
  </main>

  <script>
    (function () {
      const timeEl = document.getElementById("time");
      const yearEl = document.getElementById("year");
      if (!timeEl) return;

      const tz = "America/Santiago"; // Temuco, Chile
      const pad = (n) => String(n).padStart(2, "0");

      function formatTime(date) {
        const opts = {
          timeZone: tz,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        };
        try {
          return date.toLocaleTimeString("es-CL", opts);
        } catch (e) {
          try {
            return new Intl.DateTimeFormat("es-CL", opts).format(date);
          } catch (e2) {
            const h = pad(date.getHours());
            const m = pad(date.getMinutes());
            const s = pad(date.getSeconds());
            return `${h}:${m}:${s}`;
          }
        }
      }

      function tick() {
        timeEl.textContent = formatTime(new Date());
      }

      tick();
      setInterval(tick, 1000);
      yearEl.textContent = String(new Date().getFullYear());
    })();
  </script>
</body>
</html>
