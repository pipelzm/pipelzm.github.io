<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Felipe Lizama-Mora — Biotechnology" />
  <title>Felipe Lizama-Mora</title>
  <style>
    :root {
      color-scheme: light dark;
      --text: #111;
      --muted: rgba(17, 17, 17, 0.72);
      --line: rgba(17, 17, 17, 0.22);
      --map-bg: #e8e6e1;
      --dot-day: rgba(28, 26, 24, 0.92);
      --dot-night: rgba(28, 26, 24, 0.28);
      --dot-twilight: rgba(28, 26, 24, 0.55);
      --city-dot: #1a1816;
      --city-glow: rgba(28, 26, 24, 0.35);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f2f2f2;
        --muted: rgba(242, 242, 242, 0.72);
        --line: rgba(242, 242, 242, 0.28);
        --map-bg: #0a0b0e;
        --dot-day: rgba(235, 232, 225, 0.9);
        --dot-night: rgba(235, 232, 225, 0.14);
        --dot-twilight: rgba(235, 232, 225, 0.42);
        --city-dot: #f0ede6;
        --city-glow: rgba(240, 237, 230, 0.45);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: Canvas;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: clamp(48px, 8vw, 96px) 24px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.75rem, 7vw, 4.25rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .subtitle {
      margin: 0 0 22px;
      font-size: clamp(1rem, 2.2vw, 1.125rem);
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .clock {
      margin: 0 0 28px;
      font-size: 0.95rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .divider {
      margin: 0 0 32px;
      border: none;
      border-top: 1px solid var(--line);
    }
    .world-section { margin: 0 0 40px; }
    .world-title {
      margin: 0 0 6px;
      font-size: 1.125rem;
      font-weight: 600;
    }
    .world-hint {
      margin: 0 0 14px;
      font-size: 0.875rem;
      color: var(--muted);
    }
    .map-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 1.05;
      max-height: 440px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--map-bg);
      border: 1px solid var(--line);
    }
    #world-map {
      display: block;
      width: 100%;
      height: 100%;
    }
    .map-labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .map-label {
      position: absolute;
      transform: translate(-50%, -100%);
      font-size: 10px;
      line-height: 1.2;
      text-align: center;
      color: var(--text);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .map-label strong {
      display: block;
      font-size: 10px;
      font-weight: 600;
    }
    .map-label .lbl-time {
      font-size: 9px;
      color: var(--muted);
    }
    .map-label.is-home strong::after {
      content: " ·";
      opacity: 0.5;
    }
    .map-status {
      margin: 8px 0 0;
      font-size: 0.75rem;
      color: var(--muted);
      min-height: 1em;
    }
    .world-clocks {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px 16px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }
    .world-clocks li {
      font-size: 0.8125rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .world-clocks .city {
      display: block;
      color: var(--text);
      font-size: 0.875rem;
      margin-bottom: 2px;
    }
    .world-clocks .city-time { font-size: 0.9375rem; }
    .world-clocks li.is-home .city::after {
      content: " · tú";
      opacity: 0.65;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.25rem;
      font-size: 1rem;
    }
    nav a {
      color: inherit;
      text-decoration: none;
      opacity: 0.82;
    }
    nav a:hover {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    footer {
      margin-top: 48px;
      font-size: 0.875rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Felipe Lizama-Mora</h1>
    <p class="subtitle">biotechnology</p>
    <p class="clock">Lautaro, CL — <span id="time" aria-live="polite">loading...</span></p>

    <section id="world" class="world-section" aria-labelledby="world-title">
      <h2 id="world-title" class="world-title">Hora en el mundo</h2>
      <p class="world-hint">World · light = daytime · dark = night</p>
      <div class="map-wrap">
        <canvas id="world-map" aria-hidden="true"></canvas>
        <div id="map-labels" class="map-labels"></div>
      </div>
      <p id="map-status" class="map-status" aria-live="polite"></p>
      <ul id="world-clocks" class="world-clocks" aria-live="polite"></ul>
    </section>

    <hr class="divider" />
    <nav aria-label="Navegación principal">
      <a href="#about">about</a>
      <a href="#projects">projects</a>
      <a href="#contact">contact</a>
      <a href="https://github.com/pipelzm" rel="noopener noreferrer">github</a>
      <a href="https://mlkfeed.framer.website" rel="noopener noreferrer">feedback</a>
    </nav>
    <footer>
      <span id="year"></span> · Felipe Lizama-Mora
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script>
    (function () {
      const HOME_TZ = "America/Santiago";
      const WORLD_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json";
      const STIPPLE_TARGET = 9000;

      const CITIES = [
        { name: "Temuco", tz: "America/Santiago", lat: -38.7359, lng: -72.5904, home: true },
        { name: "Santiago", tz: "America/Santiago", lat: -33.4489, lng: -70.6693 },
        { name: "New York", tz: "America/New_York", lat: 40.7128, lng: -74.006 },
        { name: "Los Angeles", tz: "America/Los_Angeles", lat: 34.0522, lng: -118.2437 },
        { name: "London", tz: "Europe/London", lat: 51.5074, lng: -0.1278 },
        { name: "Paris", tz: "Europe/Paris", lat: 48.8566, lng: 2.3522 },
        { name: "Dubai", tz: "Asia/Dubai", lat: 25.2048, lng: 55.2708 },
        { name: "Tokyo", tz: "Asia/Tokyo", lat: 35.6762, lng: 139.6503 },
        { name: "Sidney", tz: "Australia/Sydney", lat: -33.8688, lng: 151.2093 },
      ];

      const timeOpts = { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false };

      function formatInZone(date, tz) {
        try {
          return date.toLocaleTimeString("es-CL", { ...timeOpts, timeZone: tz });
        } catch (e) {
          return "--:--:--";
        }
      }

      function solarDeclination(date) {
        const start = Date.UTC(date.getUTCFullYear(), 0, 0);
        const day = (date - start) / 86400000;
        return (23.44 * Math.PI) / 180 * Math.sin(((2 * Math.PI) / 365) * (day - 81));
      }

      function sunZenithCos(lng, lat, date) {
        const dec = solarDeclination(date);
        const utcH = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
        const ha = ((lng - (utcH - 12) * 15) * Math.PI) / 180;
        const latR = (lat * Math.PI) / 180;
        return Math.sin(latR) * Math.sin(dec) + Math.cos(latR) * Math.cos(dec) * Math.cos(ha);
      }

      function dayPhase(lng, lat, date) {
        const z = sunZenithCos(lng, lat, date);
        if (z > 0.15) return "day";
        if (z > -0.12) return "twilight";
        return "night";
      }

      const timeEl = document.getElementById("time");
      const yearEl = document.getElementById("year");
      const clocksEl = document.getElementById("world-clocks");
      const canvas = document.getElementById("world-map");
      const labelsEl = document.getElementById("map-labels");
      const statusEl = document.getElementById("map-status");
      const wrap = canvas && canvas.parentElement;

      let countries = null;
      let stipple = [];
      let projection = null;
      let width = 0;
      let height = 0;
      let dpr = 1;
      const labelNodes = [];

      function tickLocal() {
        if (timeEl) timeEl.textContent = formatInZone(new Date(), HOME_TZ);
      }

      function buildClockList() {
        if (!clocksEl) return;
        clocksEl.innerHTML = CITIES.map(
          (c) =>
            `<li${c.home ? ' class="is-home"' : ""} data-tz="${c.tz}">
              <span class="city">${c.name}</span>
              <span class="city-time">--:--:--</span>
            </li>`
        ).join("");
      }

      function tickWorldList() {
        if (!clocksEl) return;
        const now = new Date();
        clocksEl.querySelectorAll("li").forEach((li) => {
          const tz = li.getAttribute("data-tz");
          const t = li.querySelector(".city-time");
          if (t && tz) t.textContent = formatInZone(now, tz);
        });
      }

      function tickAll() {
        tickLocal();
        tickWorldList();
        drawMap();
        updateLabels();
      }

      function readCss(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function dotColor(phase) {
        if (phase === "day") return readCss("--dot-day");
        if (phase === "twilight") return readCss("--dot-twilight");
        return readCss("--dot-night");
      }

      function buildStipple(land, proj, w, h) {
        const pts = [];
        const contains = (p) => land.features.some((f) => d3.geoContains(f, p));
        let tries = 0;
        const maxTries = STIPPLE_TARGET * 14;
        while (pts.length < STIPPLE_TARGET && tries < maxTries) {
          tries += 1;
          const x = 8 + Math.random() * (w - 16);
          const y = 8 + Math.random() * (h - 16);
          const p = proj.invert([x, y]);
          if (!p || !contains(p)) continue;
          pts.push({
            lng: p[0],
            lat: p[1],
            r: 0.55 + Math.random() * 0.95,
            jitter: Math.random(),
          });
        }
        return pts;
      }

      function setupLabels() {
        if (!labelsEl) return;
        labelsEl.innerHTML = "";
        labelNodes.length = 0;
        CITIES.forEach((c) => {
          const el = document.createElement("div");
          el.className = "map-label" + (c.home ? " is-home" : "");
          el.innerHTML = `<strong>${c.name}</strong><span class="lbl-time">--:--</span>`;
          labelsEl.appendChild(el);
          labelNodes.push({ city: c, el });
        });
      }

      function updateLabels() {
        if (!projection) return;
        const now = new Date();
        labelNodes.forEach(({ city, el }) => {
          const xy = projection([city.lng, city.lat]);
          if (!xy) return;
          el.style.left = xy[0] + "px";
          el.style.top = Math.max(8, xy[1] - 6) + "px";
          const t = el.querySelector(".lbl-time");
          if (t) t.textContent = formatInZone(now, city.tz).slice(0, 5);
        });
      }

      function drawMap() {
        if (!canvas || !projection || !stipple.length) return;
        const ctx = canvas.getContext("2d");
        const now = new Date();
        const cityColor = readCss("--city-dot");
        const cityGlow = readCss("--city-glow");

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < stipple.length; i += 1) {
          const p = stipple[i];
          const xy = projection([p.lng, p.lat]);
          if (!xy) continue;
          const phase = dayPhase(p.lng, p.lat, now);
          ctx.fillStyle = dotColor(phase);
          ctx.globalAlpha = 0.55 + p.jitter * 0.45;
          ctx.beginPath();
          ctx.arc(xy[0], xy[1], p.r, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 1;
        CITIES.forEach((city) => {
          const xy = projection([city.lng, city.lat]);
          if (!xy) return;
          ctx.fillStyle = cityGlow;
          ctx.beginPath();
          ctx.arc(xy[0], xy[1], 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = cityColor;
          ctx.beginPath();
          ctx.arc(xy[0], xy[1], 2.8, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function resize() {
        if (!wrap || !canvas) return;
        width = Math.floor(wrap.clientWidth);
        height = Math.floor(wrap.clientHeight);
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        if (countries) {
          projection = d3.geoNaturalEarth1().fitExtent(
            [[12, 10], [width - 12, height - 10]],
            countries
          );
          stipple = buildStipple(countries, projection, width, height);
        }
        drawMap();
        updateLabels();
      }

      async function initMap() {
        if (!canvas || typeof d3 === "undefined" || typeof topojson === "undefined") {
          if (statusEl) statusEl.textContent = "Mapa no disponible (revisa la conexión).";
          return;
        }
        if (statusEl) statusEl.textContent = "Generando mapa en puntos…";
        try {
          const world = await fetch(WORLD_URL).then((r) => {
            if (!r.ok) throw new Error("fetch");
            return r.json();
          });
          countries = topojson.feature(world, world.objects.countries);
          setupLabels();
          resize();
          if (statusEl) statusEl.textContent = "";
        } catch (e) {
          if (statusEl) statusEl.textContent = "No se pudo cargar el mapa. Los relojes abajo siguen activos.";
        }
      }

      buildClockList();
      tickLocal();
      tickWorldList();
      setInterval(tickAll, 1000);
      if (yearEl) yearEl.textContent = String(new Date().getFullYear());

      window.addEventListener("resize", resize);
      initMap();
    })();
  </script>
</body>
</html>
